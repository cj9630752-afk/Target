<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Target Special Promotion</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #CC0000; --red-dark: #A50000;
      --bg: #F5F5F5; --white: #FFFFFF;
      --text: #1A1A1A; --muted: #666666; --green: #2E7D32;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: flex-start;
      padding: 24px 16px 40px;
    }
    .card {
      background: var(--white);
      border-radius: 20px; max-width: 400px; width: 100%;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      animation: fadeUp 0.5s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* BANNER */
    .banner {
      background: #fff;
      padding: 20px 24px 16px;
      text-align: center;
      border-bottom: 3px solid var(--red);
    }
    .banner img { height: 90px; width: auto; display: block; margin: 0 auto 8px; }
    .promo-label {
      font-size: 15px; font-weight: 700;
      color: var(--text); letter-spacing: 0.3px;
    }

    /* Claimed bar */
    .claimed-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px;
      background: #fafafa; border-bottom: 1px solid #eee;
    }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: #e0e0e0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0; overflow: hidden;
    }
    .claimed-info { flex: 1; }
    .claimed-name { font-weight: 700; font-size: 14px; color: var(--red); }
    .claimed-sub  { font-size: 12px; color: var(--muted); }
    .live-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #4CAF50;
      box-shadow: 0 0 0 3px rgba(76,175,80,0.2);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 3px rgba(76,175,80,0.2); }
      50%      { box-shadow: 0 0 0 6px rgba(76,175,80,0.05); }
    }

    /* Reward block */
    .reward-block {
      margin: 22px 24px 0;
      padding: 22px 20px; text-align: center;
    }
    .reward-eyebrow {
      font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .reward-amount {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 72px; color: var(--red); line-height: 1;
    }
    .reward-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }

    /* Steps */
    .steps { padding: 26px 24px 18px; display: flex; flex-direction: column; gap: 15px; }
    .step { display: flex; align-items: center; gap: 14px; }
    .step-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--red); color: var(--white);
      font-weight: 700; font-size: 14px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .step-text { font-size: 15px; font-weight: 500; color: var(--text); }

    /* Stats */
    .stats { display: flex; padding: 0 24px 22px; align-items: center; }
    .stat { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); }
    .stat span { color: var(--green); }
    .stat-divider { width: 1px; height: 20px; background: #ddd; margin: 0 16px; }
    .live-stat { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--text); }
    .live-dot-sm { width: 8px; height: 8px; border-radius: 50%; background: #4CAF50; animation: pulse 1.5s infinite; }

    /* CTA */
    .cta-wrap { padding: 0 24px 22px; }
    .cta-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 18px;
      background: var(--red); color: var(--white);
      border: none; border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 17px; font-weight: 700; letter-spacing: 0.5px;
      cursor: pointer; text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }
    .cta-btn:hover { background: var(--red-dark); transform: translateY(-1px); }
    .cta-btn:active { transform: translateY(0); }

    .fine-print { text-align: center; font-size: 11px; color: #aaa; padding: 0 24px 20px; }
    .fine-print a { color: #aaa; text-decoration: underline; }

    /* Toast popup */
    .toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.10);
      padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      min-width: 280px; max-width: 340px;
      z-index: 9999;
      border-left: 4px solid var(--red);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.35s ease;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .toast-info { flex: 1; }
    .toast-name { font-weight: 700; font-size: 13px; color: var(--red); }
    .toast-sub  { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .toast-dot  {
      width: 9px; height: 9px; border-radius: 50%;
      background: #4CAF50;
      box-shadow: 0 0 0 3px rgba(76,175,80,0.2);
      animation: pulse 1.5s infinite; flex-shrink: 0;
    }
  </style>
</head>

<script>
  const entries = [
    { name: "David K.",   city: "Miami, FL",       mins: 3,  initials: "DK" },
    { name: "Ashley M.",  city: "Houston, TX",      mins: 5,  initials: "AM" },
    { name: "Marcus T.",  city: "Chicago, IL",      mins: 2,  initials: "MT" },
    { name: "Brianna L.", city: "Atlanta, GA",      mins: 7,  initials: "BL" },
    { name: "James R.",   city: "Phoenix, AZ",      mins: 1,  initials: "JR" },
    { name: "Keisha W.",  city: "Detroit, MI",      mins: 4,  initials: "KW" },
    { name: "Tyler S.",   city: "Dallas, TX",       mins: 6,  initials: "TS" },
    { name: "Monique H.", city: "Las Vegas, NV",    mins: 2,  initials: "MH" },
    { name: "Carlos V.",  city: "Los Angeles, CA",  mins: 8,  initials: "CV" },
    { name: "Amber N.",   city: "Charlotte, NC",    mins: 3,  initials: "AN" },
  ];
  const colors = ["#CC0000","#1976D2","#388E3C","#F57C00","#7B1FA2","#0097A7"];
  let idx = 0;
  let hideTimer;

  function showToast() {
    const e = entries[idx % entries.length];
    const col = colors[idx % colors.length];
    const toast = document.getElementById('toast');

    document.getElementById('toastName').textContent = e.name + " claimed $500";
    document.getElementById('toastSub').innerHTML = e.city + " &bull; " + e.mins + "m ago";
    const av = document.getElementById('toastAv');
    av.textContent = e.initials;
    av.style.background = col;

    // Show
    toast.classList.add('show');
    clearTimeout(hideTimer);

    // Hide after 3s
    hideTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);

    idx++;
  }

  // First popup after 2s, then every 5s
  setTimeout(() => {
    showToast();
    setInterval(showToast, 5000);
  }, 2000);
</script>
